plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle'
    id 'net.minecraftforge.renamer'
}

// Forge 1.14.4 的 CoreMod 引擎依赖 JDK 8 自带的 Nashorn。
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

evaluationDependsOn(':common')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main {
    resources.srcDir project(':common').file('src/main/resources')
}

// ForgeGradle 默认把资源与 class 放在同一目录；处理资源时会清理目录，
// 导致增量构建删除刚编译的 class。分开输出，保证测试和打包都能读取。
sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('resources/main').get().asFile
tasks.named('processResources', ProcessResources).configure {
    destinationDir = sourceSets.main.output.resourcesDir
}

configurations {
    forgeMappings
    forgeRuntimeMappings
    fabricIntermediary
    commonNamedMinecraft
}

def commonNamedSourceSet = sourceSets.create('commonNamed') {
    java.setSrcDirs([project(':common').file('src/main/java')])
    compileClasspath = sourceSets.main.compileClasspath + configurations.commonNamedMinecraft
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
    compileOnly 'org.lwjgl:lwjgl-glfw:3.2.2'
    compileOnly 'org.lwjgl:lwjgl-opengl:3.2.2'
    forgeMappings "net.minecraft:mappings_official:${forge_mappings_version}:map2obf@tsrg.gz"
    forgeRuntimeMappings "net.minecraft:mappings_official:${forge_mappings_version}:map2srg@tsrg.gz"
    fabricIntermediary "net.fabricmc:intermediary:${minecraft_version}:v2"
    commonNamedMinecraft project(path: ':common', configuration: 'namedMinecraftElements')
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ForgeGradle 会把公共源码直接加入 Forge 的 source set。显式等待 common
// 完成清理和编译，避免根项目并行构建时 common:clean 删除 Forge 正在使用的
// 编译输出，最终生成只有资源、没有 class 的空 JAR。
tasks.named('compileJava').configure {
    dependsOn ':common:classes'
}

def extractLoomMappings = tasks.register('extractLoomMappings', Sync) {
    from({ zipTree(project(':common').configurations.getByName('mappings').singleFile) })
    include 'mappings/mappings.tiny'
    eachFile { path = 'mappings.tiny' }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('mappings/loom')
}

def loomMappingsFile = files(layout.buildDirectory.file('mappings/loom/mappings.tiny'))
        .builtBy(extractLoomMappings)
def namedToIntermediary = renamer.convert('namedToIntermediary') {
    map = loomMappingsFile
    reverse = true
}
def extractIntermediaryMappings = tasks.register('extractIntermediaryMappings', Sync) {
    from({ zipTree(configurations.fabricIntermediary.singleFile) })
    include 'mappings/mappings.tiny'
    eachFile { path = 'mappings.tiny' }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('mappings/intermediary')
}
def intermediaryMappingsFile = files(layout.buildDirectory.file('mappings/intermediary/mappings.tiny'))
        .builtBy(extractIntermediaryMappings)
def intermediaryToObfuscated = renamer.convert('intermediaryToObfuscated') {
    map = intermediaryMappingsFile
    reverse = true
}
def namedToObfuscated = renamer.chain('namedToObfuscated') {
    left namedToIntermediary
    right intermediaryToObfuscated
}
def obfuscatedToForge = renamer.convert('obfuscatedToForge') {
    map = configurations.forgeMappings
    reverse = true
}
def namedToForge = renamer.chain('namedToForge') {
    left namedToObfuscated
    right obfuscatedToForge
}
def renamedCommonSources = renamer.sources('renameCommonSources', commonNamedSourceSet) {
    extract {
        sourceCompatibility = JavaVersion.VERSION_17
    }
    apply {
        map = files(namedToForge.flatMap { it.output })
        archiveClassifier = 'forge'
    }
}
def unpackCommonSources = tasks.register('unpackCommonSources', Sync) {
    dependsOn renamedCommonSources.apply
    from({ zipTree(renamedCommonSources.file) })
    into layout.buildDirectory.dir('generated/sources/forgeCommon')
}

// Forge 1.15.2 使用旧的 Forge 命名空间。重命名器对新增源码中部分
// 仅存在于 1.17+ 的官方类型无法建立绑定，这里在解包后补齐确定的类型映射。
def patchLegacyCommonSources = tasks.register('patchLegacyCommonSources') {
    dependsOn unpackCommonSources
    doLast {
        def root = unpackCommonSources.get().destinationDir.toPath()
        def replacements = [
                'net.minecraft.network.chat.MutableComponent' : 'net.minecraft.util.text.IFormattableTextComponent',
                'net.minecraft.network.chat.TextComponent' : 'net.minecraft.util.text.StringTextComponent',
                'net.minecraft.network.chat.TranslatableComponent' : 'net.minecraft.util.text.TranslationTextComponent',
                'net.minecraft.network.chat.ClickEvent' : 'net.minecraft.util.text.event.ClickEvent',
                'net.minecraft.network.chat.HoverEvent' : 'net.minecraft.util.text.event.HoverEvent',
                'net.minecraft.network.chat.Component' : 'net.minecraft.util.text.ITextComponent',
                'net.minecraft.world.item.Items' : 'net.minecraft.item.Items',
                'net.minecraft.world.item.ItemStack' : 'net.minecraft.item.ItemStack',
                'net.minecraft.world.item.Item' : 'net.minecraft.item.Item',
                'net.minecraft.client.gui.components.AbstractSliderButton' : 'net.minecraft.client.gui.widget.AbstractSlider',
                'com.mojang.blaze3d.platform.InputConstants' : 'net.minecraft.client.util.InputMappings',
                'com.mojang.blaze3d.vertex.VertexFormat' : 'net.minecraft.client.renderer.vertex.VertexFormat'
        ]
        java.nio.file.Files.walk(root).filter { it.toString().endsWith('.java') }.forEach { path ->
            def text = java.nio.file.Files.readString(path)
            replacements.each { from, to -> text = text.replace(from, to) }
            java.nio.file.Files.writeString(path, text)
        }
    }
}

sourceSets.main.java.srcDir(patchLegacyCommonSources.map { unpackCommonSources.get().destinationDir })

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_loader_version_range: forge_loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties values
    expand values
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.named('jar', Jar).configure {
    archiveClassifier = 'dev'
    from sourceSets.main.output.classesDirs
}

def reobfJar = renamer.classes('reobfJar', tasks.named('jar', Jar)) {
    map = configurations.forgeRuntimeMappings
    archiveClassifier = ''
    output = layout.buildDirectory.file("libs/${mod_id}-${minecraft_version}-forge-${mod_version}.jar")
    javaLauncher = javaToolchains.launcherFor { spec ->
        spec.languageVersion.set(JavaLanguageVersion.of(17))
    }
}

tasks.named('assemble').configure {
    dependsOn reobfJar
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
