name: Build

on:
  push:
    # 只在主分支和 Minecraft 版本分支上执行 push 构建，避免临时分支重复构建。
    branches:
      - main
      - "mc/**"
    # 仅构建相关文件发生变化时触发；单独修改文档或 Markdown 文件不会触发。
    paths:
      - ".github/workflows/**"
      - "common/**"
      - "fabric/**"
      - "forge/**"
      - "neoforge/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    # PR 使用同一组路径过滤，文档类 PR 不启动 Gradle 构建。
    paths:
      - ".github/workflows/**"
      - "common/**"
      - "fabric/**"
      - "forge/**"
      - "neoforge/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"

permissions:
  # 构建只需要读取仓库内容。
  contents: read

concurrency:
  # 同一个 PR 只保留最新一次构建，新的提交会取消旧的 PR 构建。
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 防止依赖下载或构建异常导致 Runner 长时间占用。
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # 构建不依赖 Git 历史或标签，使用浅克隆以减少 checkout 时间。
          fetch-depth: 1

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew build
