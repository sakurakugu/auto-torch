plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    resources.srcDir project(':common').file('src/main/resources')
    if (System.getenv('AUTOTORCH_LOCAL_TEST_DIR')) {
        // NeoForge 的模块层要求测试运行器与模组共用类加载器。
        java.srcDir project(':common').file('src/localTest/java')
    }
}

// 导入本地测试资源集
sourceSets {
    localTest {
        java.srcDir project(':common').file('src/localTest/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            if (System.getenv('AUTOTORCH_LOCAL_TEST_WORLD_FOLDER')
                    && System.getenv('AUTOTORCH_LOCAL_TEST_CREATE_WORLD') == '0') {
                // NeoForge 通过运行配置注入参数，避免 Gradle --args 覆盖启动主类。
                programArgument '--quickPlaySingleplayer'
                programArgument System.getenv('AUTOTORCH_LOCAL_TEST_WORLD_FOLDER')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/sakurakugu/autotorch/localtest/**'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties values
    expand values
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
