plugins {
    id 'net.minecraftforge.gradle' version '[7.0.17,8)' apply false
    id 'net.minecraftforge.renamer' version '1.1.2' apply false
}

// 将 json 翻译文件转换为 lang 文件
ext.legacyLangModId = mod_id
ext.legacyLangSourceDir =
        rootProject.file("common/src/main/resources/assets/${mod_id}/lang")

apply from: rootProject.file("gradle/legacy-lang.gradle")

ext.minecraft_version_range = "[${minecraft_version}]"

allprojects {
    group = mod_group_id
    version = mod_version
}

subprojects {
    repositories {
        mavenCentral()
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(8)

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.compilerArgs.addAll(['-Xlint:deprecation', '-Xmaxerrs', '1000'])
        }

        // Java 8 启动器会错误解码开发目录中的中文路径，运行客户端时改用 JDK 17。
        tasks.withType(JavaExec).configureEach {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
    }
}

def copyBuildArtifacts = tasks.register('copyBuildArtifacts', Copy) {
    group = 'build'
    description = 'Copies and renames the publishable jars into a versioned root build directory.'
    dependsOn ':forge:build'
    into layout.buildDirectory.dir("v${mod_version}")

    from(project(':forge').layout.buildDirectory.dir('libs')) {
        include "${mod_id}-${minecraft_version}-forge-${mod_version}.jar"
        rename { "${mod_id}-v${mod_version}-mc${minecraft_version}-forge.jar" }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds the publishable Forge jar.'
    dependsOn copyBuildArtifacts
}

tasks.register('build') {
    group = 'build'
    description = 'Builds and tests all loader targets.'
    dependsOn ':forge:test', copyBuildArtifacts
}
