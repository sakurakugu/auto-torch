# 设置 Gradle 命令使用的默认内存，可由用户属性或命令行属性覆盖。
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Forge 1.8.9 要求开发环境中的模组类和资源位于同一目录。
net.minecraftforge.gradle.merge-source-sets=true

# 环境属性
# Minecraft 版本
minecraft_version=1.8.9
# Forge 版本
forge_version=1.8.9-11.15.1.2318-1.8.9
forge_loader_version_range=[11,)
night_config_version=3.6.7

## 模组属性

# 模组的唯一标识符。必须在英语区域设置下使用小写，并符合正则表达式 [a-z][a-z0-9_]{1,63}
# 必须与使用 @Mod 注解的模组主类中的字符串常量一致。
mod_id=autotorch
# 模组供用户阅读的显示名称。
mod_name=Auto Torch
# 模组许可证。可在 https://choosealicense.com/ 查看可选方案，默认为保留所有权利。
mod_license=MIT
# 模组版本。参阅 https://semver.org/
mod_version=1.5.0
# 模组的组 ID，仅在将构件发布到 Maven 仓库时有意义。
# 此值应与模组源代码使用的基础包名一致。
# 参阅 https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.sakurakugu.autotorch
